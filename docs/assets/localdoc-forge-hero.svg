<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">LocalDoc Forge — 本地文档工坊</title>
  <desc id="desc">离线、可解释、批量的文档转换与 PDF 文本提取工具</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#12213c"/>
      <stop offset="1" stop-color="#162d4f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62e6c4"/>
      <stop offset="1" stop-color="#5ea0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000814" flood-opacity="0.34"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8cb7e8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1440" height="560" rx="32" fill="url(#bg)"/>
  <rect width="1440" height="560" rx="32" fill="url(#grid)"/>
  <circle cx="1248" cy="88" r="210" fill="#4d8eff" opacity="0.09"/>
  <circle cx="1120" cy="520" r="240" fill="#42d6b3" opacity="0.07"/>

  <g transform="translate(92 88)">
    <rect x="0" y="0" width="70" height="70" rx="18" fill="url(#accent)"/>
    <path d="M22 17h19l10 10v26H22z" fill="#071526" opacity="0.92"/>
    <path d="M41 17v11h10" fill="none" stroke="#73f3d0" stroke-width="3"/>
    <path d="M29 37h16M29 44h16" stroke="#73f3d0" stroke-width="3" stroke-linecap="round"/>
    <text x="94" y="42" fill="#eaf4ff" font-size="52" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">LocalDoc Forge</text>
    <text x="96" y="76" fill="#8fb0d6" font-size="22" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" letter-spacing="2">本地文档工坊</text>

    <text x="0" y="152" fill="#f5f9ff" font-size="38" font-weight="650" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">离线、可解释、批量</text>
    <text x="0" y="198" fill="#b9cce4" font-size="25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">TXT · Markdown · DOCX 互转，PDF 原生提取与本地 OCR 回退</text>

    <g transform="translate(0 250)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700">
      <g><rect width="118" height="48" rx="14" fill="#1c3455" stroke="#4d719c"/><text x="59" y="31" text-anchor="middle" fill="#dcecff">TXT</text></g>
      <g transform="translate(136 0)"><rect width="150" height="48" rx="14" fill="#1c3455" stroke="#4d719c"/><text x="75" y="31" text-anchor="middle" fill="#dcecff">Markdown</text></g>
      <g transform="translate(304 0)"><rect width="118" height="48" rx="14" fill="#1c3455" stroke="#4d719c"/><text x="59" y="31" text-anchor="middle" fill="#dcecff">DOCX</text></g>
      <g transform="translate(440 0)"><rect width="190" height="48" rx="14" fill="#173f46" stroke="#38bfa0"/><text x="95" y="31" text-anchor="middle" fill="#8ff4da">PDF → TXT</text></g>
    </g>

    <g transform="translate(0 330)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17">
      <circle cx="9" cy="9" r="9" fill="#58d9b6"/><path d="M5 9l3 3 6-7" fill="none" stroke="#082118" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="15" fill="#cfe0f2">文件不上传 · 不调用 AI API</text>
      <circle cx="269" cy="9" r="9" fill="#58d9b6"/><path d="M265 9l3 3 6-7" fill="none" stroke="#082118" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="288" y="15" fill="#cfe0f2">批量转换与可解释报告</text>
    </g>
  </g>

  <g transform="translate(928 94)" filter="url(#shadow)">
    <rect width="392" height="372" rx="28" fill="#f7fbff"/>
    <rect x="0" y="0" width="392" height="54" rx="28" fill="#e8f1fb"/>
    <rect x="0" y="28" width="392" height="26" fill="#e8f1fb"/>
    <circle cx="28" cy="27" r="6" fill="#ff7582"/>
    <circle cx="49" cy="27" r="6" fill="#ffc65c"/>
    <circle cx="70" cy="27" r="6" fill="#55d6a5"/>
    <rect x="28" y="82" width="214" height="18" rx="9" fill="#172d4b"/>
    <rect x="28" y="112" width="286" height="10" rx="5" fill="#9db0c7"/>
    <rect x="28" y="144" width="336" height="78" rx="15" fill="#eef4fa" stroke="#c6d7e9" stroke-dasharray="7 6"/>
    <path d="M182 170h28l14 14v20h-42z" fill="#5aa5ff" opacity="0.85"/>
    <path d="M210 170v15h14" fill="none" stroke="#eef8ff" stroke-width="3"/>
    <rect x="28" y="246" width="160" height="42" rx="12" fill="#e7eef7"/>
    <rect x="204" y="246" width="160" height="42" rx="12" fill="#e7eef7"/>
    <rect x="28" y="312" width="336" height="38" rx="12" fill="url(#accent)"/>
    <text x="196" y="337" text-anchor="middle" fill="#08213a" font-size="16" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">开始本地转换</text>
  </g>
</svg>
